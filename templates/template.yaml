AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con Apache creada desde GitHub Actions y CloudFormation

Parameters:
  InstanceDescription:
    Description: Texto principal que se mostrara en la pagina web
    Type: String
    Default: Servidor Web Apache

  SecurityGroupDescription:
    Description: Descripcion del Security Group
    Type: String
    Default: Acceso HTTP al servidor

  LatestAmiId:
    Description: AMI mas reciente de Amazon Linux 2023 (se consulta automaticamente)
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  # Para recrear la instancia (y que User Data vuelva a correr) cambia este nombre,
  # por ejemplo a MyInstanceClaseV3, y actualizalo tambien en los Outputs.

  MyInstanceClaseV2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      SecurityGroups:
        - !Ref ServerSecurityGroupClase
      Tags:
        - Key: Name
          Value: EC2-KevinDiaz-v2
        - Key: Proyecto
          Value: Class-CloudFormation
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          # ---- Personaliza el HTML de aqui hacia abajo (hasta EOF) ----
          cat > /var/www/html/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Kevin Diaz - Infraestructura como código en AWS</title>
            <style>
              :root {
                --bg: #e8edf1;
                --ink: #0f1b2d;
                --muted: #55657a;
                --line: #b9c4d0;
                --panel: #ffffff;
                --signal: #2447f5;
              }
              * { box-sizing: border-box; }
              html { -webkit-text-size-adjust: 100%; }
              body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                line-height: 1.55;
              }
              .wrap { max-width: 1040px; margin: 0 auto; padding: 48px 24px 64px; }

              /* Cabecera */
              .topline { color: var(--muted); font-size: 15px; margin: 0 0 56px; }
              h1 {
                font-family: Georgia, "Times New Roman", serif;
                font-weight: 400;
                font-size: clamp(2.4rem, 7vw, 4.8rem);
                line-height: 1.04;
                letter-spacing: -0.02em;
                margin: 0 0 20px;
                max-width: 16ch;
              }
              .lead { font-size: 1.15rem; color: var(--muted); max-width: 52ch; margin: 0 0 72px; }

              /* Recorrido del despliegue */
              h2 { font-size: 1.1rem; font-weight: 700; margin: 0 0 24px; }
              .route {
                list-style: none;
                margin: 0 0 80px;
                padding: 0;
                display: grid;
                gap: 0;
                grid-template-columns: 1fr;
              }
              .route li {
                position: relative;
                padding: 0 0 32px 40px;
              }
              .route li::before {
                content: "";
                position: absolute;
                left: 7px; top: 8px; bottom: -8px;
                width: 2px;
                background: var(--line);
              }
              .route li:last-child { padding-bottom: 0; }
              .route li:last-child::before { display: none; }
              .route li::after {
                content: "";
                position: absolute;
                left: 0; top: 4px;
                width: 16px; height: 16px;
                border-radius: 50%;
                background: var(--bg);
                border: 2px solid var(--ink);
              }
              .route li.here::after {
                background: var(--signal);
                border-color: var(--signal);
                animation: pulse 2.4s ease-out 3;
              }
              .route strong { display: block; font-size: 1.05rem; }
              .route span { color: var(--muted); font-size: 0.95rem; }
              .route .here strong { color: var(--signal); }
              @keyframes pulse {
                0%   { box-shadow: 0 0 0 0 rgba(36, 71, 245, 0.5); }
                100% { box-shadow: 0 0 0 16px rgba(36, 71, 245, 0); }
              }

              @media (min-width: 820px) {
                .route { grid-template-columns: repeat(4, 1fr); gap: 24px; }
                .route li { padding: 40px 0 0 0; }
                .route li::before { left: 16px; right: -24px; top: 7px; bottom: auto; width: auto; height: 2px; }
                .route li::after { left: 0; top: 0; }
              }

              /* Datos */
              .facts { display: grid; gap: 24px; grid-template-columns: 1fr; margin-bottom: 64px; }
              @media (min-width: 820px) { .facts { grid-template-columns: 5fr 7fr; } }
              .panel { background: var(--panel); padding: 28px; border-radius: 4px; }
              dl { margin: 0; }
              dt { color: var(--muted); font-size: 0.85rem; margin-top: 16px; }
              dt:first-child { margin-top: 0; }
              dd { margin: 2px 0 0; font-size: 1.05rem; }
              table { width: 100%; border-collapse: collapse; }
              th, td { text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
              th { width: 42%; font-weight: 400; color: var(--muted); padding-right: 16px; }
              tr:last-child th, tr:last-child td { border-bottom: 0; }

              /* Pie */
              footer { display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--ink); padding-top: 20px; }
              footer p { margin: 0; }
              a { color: var(--signal); font-weight: 600; }
              a:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
              @media (prefers-reduced-motion: reduce) { .route li.here::after { animation: none; } }
            </style>
          </head>
          <body>
            <main class="wrap">
              <p class="topline">Cloud Computing, Universidad Francisco de Paula Santander Ocaña</p>

              <h1>${InstanceDescription}</h1>
              <p class="lead">Hola desde CloudFormation con GitHub. Esta página se publicó sin entrar al servidor: el repositorio describe la infraestructura y GitHub Actions la crea en AWS.</p>

              <h2>Cómo llegó esta página hasta aquí</h2>
              <ol class="route">
                <li>
                  <strong>Repositorio en GitHub</strong>
                  <span>Guarda la plantilla que describe toda la infraestructura.</span>
                </li>
                <li>
                  <strong>GitHub Actions</strong>
                  <span>Detecta el cambio y lanza el despliegue automáticamente.</span>
                </li>
                <li>
                  <strong>AWS CloudFormation</strong>
                  <span>Lee la plantilla y crea los recursos en AWS.</span>
                </li>
                <li class="here">
                  <strong>Servidor EC2 con Apache</strong>
                  <span>Sirve esta página. Estás aquí.</span>
                </li>
              </ol>

              <section class="facts">
                <div class="panel">
                  <h2>Autor</h2>
                  <dl>
                    <dt>Nombre</dt>
                    <dd>Kevin Alejandro Diaz Franco</dd>
                    <dt>Código</dt>
                    <dd>0192193</dd>
                    <dt>Programa</dt>
                    <dd>Ingeniería de Sistemas</dd>
                  </dl>
                </div>
                <div class="panel">
                  <h2>Qué se desplegó</h2>
                  <table>
                    <tr><th>Infraestructura</th><td>AWS CloudFormation</td></tr>
                    <tr><th>Automatización</th><td>GitHub Actions</td></tr>
                    <tr><th>Servidor</th><td>EC2 t3.micro</td></tr>
                    <tr><th>Servidor web</th><td>Apache</td></tr>
                  </table>
                </div>
              </section>

              <footer>
                <p>Docente: Wilder Andrés Duarte Neira</p>
                <p><a href="https://github.com/KadSeven/0192193-AWS-Kevin_diaz">Ver el repositorio del proyecto</a></p>
              </footer>
            </main>
          </body>
          </html>
          EOF

  ServerSecurityGroupClase:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Ref SecurityGroupDescription
      Tags:
        - Key: Name
          Value: SG-HTTP-Clase-CF
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

Outputs:

  InstanceId:
    Description: ID de la instancia EC2
    Value: !Ref MyInstanceClaseV2

  PublicIP:
    Description: IP publica de la instancia
    Value: !GetAtt MyInstanceClaseV2.PublicIp

  WebsiteURL:
    Description: URL para abrir la pagina web
    Value: !Sub http://${MyInstanceClaseV2.PublicIp}
